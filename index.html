<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iyurra Natural Foods | Traditional Nutrition for Modern Families</title>

    <script>
        (function(){
            var stored = localStorage.getItem("iyurra-theme");
            var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <meta name="description"
        content="Iyurra Natural Foods offers healthy traditional health mix made from millets, pulses and natural ingredients for kids, adults and diabetic-friendly nutrition.">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
/>

</head>

<body>

    <!--
        This page is assembled at runtime from the files in /partials.
        Each section lives in its own file (partials/hero.html, partials/products.html, etc.)
        so it's easier to find and edit a single section without scrolling through one huge file.
        includes.js fetches each one and drops it in below, then fires "includes:loaded"
        once everything is in the DOM — script.js waits for that event before it runs
        (Swiper, AOS and the product modal all need the real markup to exist first).
    -->

    <div data-include="partials/header.html"></div>
    <div data-include="partials/hero.html"></div>
    <div data-include="partials/products.html"></div>
    <div data-include="partials/oils.html"></div>
    <div data-include="partials/powders.html"></div>
    <div data-include="partials/about.html"></div>
    <div data-include="partials/reviews.html"></div>
    <div data-include="partials/contact.html"></div>
    <div data-include="partials/footer.html"></div>
    <div data-include="partials/modal.html"></div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="data/products.js"></script>
<script src="includes.js"></script>
<script src="script.js"></script>

</body>
</html>
